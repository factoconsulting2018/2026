name: SQL injection guardrails

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  sql-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run SQL audit script
        run: bash tools/sql-injection-audit.sh
